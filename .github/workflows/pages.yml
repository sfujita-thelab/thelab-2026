# Publishes the site to GitHub Pages on every push to main.
#
# It publishes the repo as it is, with one change: expertise/v2/a is ALSO copied up into
# expertise/v2, so the page lives at /expertise/v2/ online while the working copy keeps
# it in a (/expertise/v2/a/ keeps working too). expertise/v1 needs no copy any more: its
# page sits in expertise/v1 itself (a moved up, b removed, 2026-11-04).
#
# Folders starting with _ (_archive, _review) and dotfiles stay unpublished, as they
# were under the old branch build.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the site folder
        run: |
          rsync -a --exclude '.*' --exclude '_*' ./ _site/
          # expertise/v2/a -> expertise/v2, the same way
          rsync -a --exclude '.*' expertise/v2/a/ _site/expertise/v2/
          # ...every link out of it loses a ../ too (the logo, and the nav's Work)
          sed -i 's|href="\.\./\.\./\.\./|href="../../|g' _site/expertise/v2/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
